<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <button id="panel-toggle" type="button" aria-label="Hide panel" aria-expanded="true">✕</button>

  <aside id="panel">
    <div id="fatal-error" class="banner banner-error" hidden></div>

    <header class="app-header">
      <div class="app-header-row">
        <div class="app-header-text">
          <h1 id="app-title"></h1>
          <p id="app-description" class="app-description"></p>
        </div>
        <button id="copy-link-btn" type="button" class="chip-btn" aria-label="Copy shareable link" title="Copy shareable link">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M10.5 13.5 L13.5 10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8.5 15.5 L6.5 17.5 A3 3 0 0 1 2.5 13.5 L5.5 10.5 A3 3 0 0 1 9.5 10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M15.5 8.5 L17.5 6.5 A3 3 0 0 1 21.5 10.5 L18.5 13.5 A3 3 0 0 1 14.5 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="panel-section">
      <h2>Location</h2>
      <div class="location-row">
        <input type="text" id="search-input" placeholder="Search for a place…" autocomplete="off">
        <button id="locate-btn" type="button" class="icon-btn" aria-label="Go to my location" title="Go to my location">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="1" x2="12" y2="6" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="18" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
            <line x1="1" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="2"/>
            <line x1="18" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <label class="follow-row">
        <input type="checkbox" id="follow-location-checkbox">
        Follow my location
      </label>
      <div id="search-status" class="status" hidden></div>
      <div id="locate-status" class="status" hidden></div>
      <ul id="search-results"></ul>
    </section>

    <section class="panel-section">
      <div class="section-header">
        <h2>Layers</h2>
        <button id="reset-layers-btn" type="button" class="chip-btn" aria-label="Reset layers to defaults" title="Reset layers to defaults">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M20 11A8 8 0 1 0 18.5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 5 L20 11 L14 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <ul id="layer-list"></ul>
    </section>

    <footer id="app-footer" class="panel-footer"></footer>
  </aside>

  <script src="config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="app.js" type="module"></script>
</body>
</html>
